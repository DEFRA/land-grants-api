version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PRs
    groups:
      dev:
        applies-to: 'version-updates'
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      prod:
        applies-to: 'version-updates'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      security:
        applies-to: 'security-updates'
        patterns:
          - '*'

      other:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

    ignore:
      # neostandard peer-depends on eslint 9.x
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        versions: ['>=25']
      # hapi-swagger peer-depends on joi 17.x; lift when it supports 18
      - dependency-name: 'joi'
        update-types: ['version-update:semver-major']
      # TS 7 fails lint:types; lift once the migration is done
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update docker packages
  - package-ecosystem: docker
    directory: /

    ignore:
      - dependency-name: 'node'
        versions: ['>=25']
      # Aurora PostgreSQL 16 in CDP; lift when CDP upgrades
      - dependency-name: 'postgis/postgis'
        versions: ['>=17']

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

  # Update docker-compose packages
  - package-ecosystem: docker-compose
    directory: /

    ignore:
      - dependency-name: 'node'
        versions: ['>=25']

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7
