version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PRs
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - 'aws*'

      babel:
        patterns:
          - '@babel/*'
          - 'babel*'

      hapi:
        patterns:
          - '@hapi/*'
          - 'hapi-*'

      lint:
        patterns:
          - 'prettier'
          - 'stylelint'
          - 'stylelint-*'

      pino-logging:
        patterns:
          - '*-pino'
          - '*-pino-format'
          - 'pino'
          - 'pino-*'
          - 'pino-pretty'

      postgres:
        patterns:
          - 'pg-*'
          - 'pg-copy-streams'
          - 'pg'

      test:
        patterns:
          - '@pact-foundation/*'
          - '@vitest/*'
          - '*vitest*'
          - 'vitest-fetch-mock'

      tools:
        patterns:
          - 'husky'
          - 'nodemon'
          - 'npm-run-all'
          - 'nyc'
          - 'tsx'

      types:
        patterns:
          - '@types/*'

    ignore:
      # neostandard peer-depends on eslint 9.x
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        versions: ['>=25']
      # hapi-swagger peer-depends on joi 17.x; lift when it supports 18
      - dependency-name: 'joi'
        update-types: ['version-update:semver-major']
      # TS 7 fails lint:types; lift once the migration is done
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update docker packages
  - package-ecosystem: docker
    directory: /

    ignore:
      - dependency-name: 'node'
        versions: ['>=25']
      # Aurora PostgreSQL 16 in CDP; lift when CDP upgrades
      - dependency-name: 'postgis/postgis'
        versions: ['>=17']

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

  # Update docker-compose packages
  - package-ecosystem: docker-compose
    directory: /

    ignore:
      - dependency-name: 'node'
        versions: ['>=25']

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: 'Europe/London'

    cooldown:
      default-days: 7
