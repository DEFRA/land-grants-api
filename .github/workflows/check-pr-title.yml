name: Check PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

jobs:
  check-title:
    name: Check PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$PR_ACTOR" = "dependabot[bot]" ]; then
            echo "Dependabot pull request, skipping title check."
            exit 0
          fi

          # A ticket key, a Conventional Commits prefix, or a GitHub-generated revert.
          PATTERN='^([A-Z][A-Z0-9]+-[0-9]+:?[[:space:]]+.+|(build|chore|ci|deps|docs|feat|fix|perf|refactor|revert|test)(\([^)]+\))?!?:[[:space:]]+.+|Revert[[:space:]]+".+")'

          if printf '%s' "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "Title OK: $PR_TITLE"
            exit 0
          fi

          echo "::error::PR title '$PR_TITLE' does not match the expected format."
          echo ""
          echo "Expected one of:"
          echo "  GSPS-123 Short description     the colon is optional"
          echo "  GSPS-000 Short description     where there is genuinely no ticket"
          echo "  chore: short description       Conventional Commits prefix, also for no ticket"
          echo ""
          echo "This repository squashes on merge, so the title becomes the commit message on main."
          exit 1
