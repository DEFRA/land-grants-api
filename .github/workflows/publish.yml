name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: main-serial
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make extract seed file script executable
        run: chmod +x ./scripts/extract-gz-to-sql

      - name: Extract seed files
        run: ./scripts/extract-gz-to-sql src/land-data/migration changelog/

      - name: Publish Database Schema
        uses: DEFRA/cdp-build-action/publish-db-migrations@main
        with:
          path: ./changelog
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Create Test Coverage Reports
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publish Schemas Package
        # Until the npm credentials are in place, a failed publish must not fail the deploy
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./packages/schemas/package.json').version")
          if npm view "@defra/land-grants-schemas@$version" version > /dev/null 2>&1; then
            echo "@defra/land-grants-schemas@$version is already published"
          else
            npm publish --workspace packages/schemas --ignore-scripts=false
          fi
