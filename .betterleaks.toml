title = "land-grants-api betterleaks config"

[extend]
useDefault = true

[[rules]]
id = "issued-sbi"
description = "Single Business Identifier (SBI) in the issued range; use a synthetic SBI from 800000001 to 800000999"
regex = '''(?i)sbi[^\n]{0,40}?\b(1\d{8})\b'''
secretGroup = 1
keywords = ["sbi"]

[[rules]]
id = "issued-crn-or-frn"
description = "Customer Reference Number (CRN) or Firm Reference Number (FRN) in the issued range; use a synthetic CRN from 9000000001 to 9000000999, or a synthetic FRN of 0 followed by a synthetic SBI"
regex = '''(?i)(?:crn|frn)[^\n]{0,40}?\b(1\d{9})\b'''
secretGroup = 1
keywords = ["crn", "frn"]

[[rules]]
id = "government-email-address"
description = "Email address of a real government employee; use a dummy or test address instead"
regex = '''(?i)\b([a-z0-9._%+'-]+@(?:[a-z0-9-]+\.)*(?:gov\.uk|naturalengland\.org\.uk))\b'''
secretGroup = 1
keywords = ["gov.uk", "naturalengland.org.uk"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''(?i)^(dummy|test|test\.user|example|noreply|no-reply)@''']

[[allowlists]]
description = "Dependencies, lockfiles and generated output"
paths = ['''(^|/)node_modules/''', '''(^|/)package-lock\.json$''', '''(^|/)coverage/''', '''(^|/)dist/''']
