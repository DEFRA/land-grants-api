x-common-migration: &common-migration
  POSTGRES_HOST: ${POSTGRES_HOST:-land-grants-backend-postgres}
  SCHEMA_ROLE: ${POSTGRES_SCHEMA_ROLE:-land_grants_api}
  SCHEMA_NAME: ${POSTGRES_SCHEMA_NAME:-public}
  ENFORCE_SCHEMA_PERMISSIONS: ${ENFORCE_SCHEMA_PERMISSIONS:-true}

# Postgres role used to run liquibase migrations (and own the schema objects), matching
# production where land_grants_api_ddl is a superuser role.
x-common-postgres-ddl: &common-postgres-ddl
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-land_grants_api}
  POSTGRES_PASSWORD: ${POSTGRES_DDL_PASSWORD:-land_grants_api}
  POSTGRES_USER: ${POSTGRES_DDL_USER:-land_grants_api_ddl}

services:
  database-up:
    image: liquibase/liquibase:4.33-alpine
    restart: 'no'
    environment:
      <<: [*common-postgres-ddl, *common-migration]
    entrypoint: >
      sh -c "/scripts/migration/database-up"
    volumes:
      - ./changelog:/liquibase/changelog
      - ./scripts:/scripts
    networks:
      - grants-ui-net

  database-down:
    image: liquibase/liquibase:4.33-alpine
    restart: 'no'
    environment:
      <<: [*common-postgres-ddl, *common-migration]
    entrypoint: >
      sh -c "/scripts/migration/database-down"
    volumes:
      - ./changelog:/liquibase/changelog
      - ./scripts:/scripts
    networks:
      - grants-ui-net

networks:
  grants-ui-net:
    name: grants-ui-net
    external: true
